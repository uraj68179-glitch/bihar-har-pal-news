<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add / Edit News - Bihar Har Pal News</title>
    <link rel="stylesheet" href="admin-style.css">

    <style>
        .news-form {
            margin: 30px;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 15px;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .checkbox-group {
            display: flex;
            gap: 25px;
            margin: 15px 0;
        }

        .checkbox-group label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-group input {
            width: auto;
        }

        .publish-btn {
            background: #c40000;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .publish-btn:hover {
            background: #9e0000;
        }

        .publish-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }

        .current-img-preview {
            margin-top: 10px;
            display: none;
        }

        .current-img-preview img {
            max-width: 220px;
            border-radius: 6px;
            border: 1px solid #ddd;
            display: block;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .news-form {
                margin: 15px;
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="admin-logo">
            <div class="admin-logo-circle">BHP</div>
            <h2>Bihar Har Pal</h2>
            <p>News Admin</p>
        </div>

        <nav class="admin-menu">
            <a href="index.html">📊 Dashboard</a>
            <a href="add-news.html" class="active">📝 Add News</a>
            <a href="index.html#recent-news-section">📰 All News</a>
            <a href="#">📂 Categories</a>
            <a href="#">🖼️ Media</a>
            <a href="#">⚙️ Settings</a>
        </nav>

        <div class="logout">
            <a href="../index.html">🌐 View Website</a>
        </div>
    </aside>

    <!-- Main -->
    <main class="main">
        <header class="top-header">
            <div>
                <h1 id="pageTitle">Add News</h1>
                <p id="pageSubtitle">नई खबर प्रकाशित करें</p>
            </div>
            <div class="admin-user">👤 Administrator</div>
        </header>

        <!-- News Form -->
        <form id="newsForm" class="news-form">
            <div class="form-group">
                <label>News Headline</label>
                <input type="text" id="headline" placeholder="खबर की मुख्य Headline लिखें" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="बिहार">बिहार</option>
                        <option value="भारत">भारत</option>
                        <option value="दुनिया">दुनिया</option>
                        <option value="राजनीति">राजनीति</option>
                        <option value="खेल">खेल</option>
                        <option value="बिजनेस">बिजनेस</option>
                        <option value="मनोरंजन">मनोरंजन</option>
                        <option value="टेक्नोलॉजी">टेक्नोलॉजी</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="जैसे - पटना, बिहार">
                </div>
            </div>

            <div class="form-group">
                <label>Short Description</label>
                <textarea id="shortDescription" placeholder="खबर का छोटा विवरण लिखें..."></textarea>
            </div>

            <div class="form-group">
                <label>Full News</label>
                <textarea id="fullNews" style="min-height: 300px;" placeholder="यहां पूरी खबर लिखें..." required></textarea>
            </div>

            <div class="form-group">
                <label id="imageLabel">Featured Image</label>
                <input type="file" id="newsImage" accept="image/*">
                <div id="currentImgBox" class="current-img-preview">
                    <small style="color: #555;">वर्तमान फोटो (बदलने के लिए ऊपर नई फाइल चुनें):</small>
                    <img id="currentImgPreview" src="" alt="Current News Image">
                </div>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="breakingNews"> Breaking News
                </label>
                <label>
                    <input type="checkbox" id="featuredNews"> Featured News
                </label>
            </div>

            <button type="submit" id="publishBtn" class="publish-btn">
                🚀 Publish News
            </button>
        </form>
    </main>

    <!-- Firebase Authentication, Firestore & Cloudinary Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAcZtid0O23fr5J1AySK6ptZfPveITMReU",
            authDomain: "bihar-har-pal-news-52a25.firebaseapp.com",
            projectId: "bihar-har-pal-news-52a25",
            storageBucket: "bihar-har-pal-news-52a25.firebasestorage.app",
            messagingSenderId: "25215359679",
            appId: "1:25215359679:web:3c069cb8d7cdaa2e32040a"
        };

        const CLOUDINARY_CLOUD_NAME = "wmbcrydw";
        const CLOUDINARY_UPLOAD_PRESET = "bihar_news_preset";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // URL se check karein ki kya Edit mode hai (?edit=DOC_ID)
        const urlParams = new URLSearchParams(window.location.search);
        const editNewsId = urlParams.get("edit");
        let existingImageUrl = "";

        const newsForm = document.getElementById("newsForm");
        const publishBtn = document.getElementById("publishBtn");

        // Security Check & Edit Data Load
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else if (editNewsId) {
                await loadNewsForEdit(editNewsId);
            }
        });

        // Logout button
        const adminUserEl = document.querySelector(".admin-user");
        if (adminUserEl) {
            adminUserEl.innerHTML = `👤 Admin | <button id="logoutBtn" style="background:#c40000;color:#fff;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;margin-left:8px;">Logout</button>`;
            document.getElementById("logoutBtn").addEventListener("click", async () => {
                await signOut(auth);
                window.location.href = "login.html";
            });
        }

        // Purani news ka data form mein bharne ka function
        async function loadNewsForEdit(docId) {
            document.getElementById("pageTitle").innerText = "Edit News";
            document.getElementById("pageSubtitle").innerText = "खबर में सुधार (Update) करें";
            publishBtn.innerText = "💾 Update News";
            publishBtn.style.background = "#0d6efd";

            try {
                const docRef = doc(db, "news", docId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("headline").value = data.headline || "";
                    document.getElementById("category").value = data.category || "बिहार";
                    document.getElementById("location").value = data.location || "";
                    document.getElementById("shortDescription").value = data.shortDescription || "";
                    document.getElementById("fullNews").value = data.fullNews || "";
                    document.getElementById("breakingNews").checked = !!data.breakingNews;
                    document.getElementById("featuredNews").checked = !!data.featuredNews;

                    if (data.imageUrl) {
                        existingImageUrl = data.imageUrl;
                        document.getElementById("currentImgPreview").src = data.imageUrl;
                        document.getElementById("currentImgBox").style.display = "block";
                    }
                } else {
                    alert("यह खबर डेटाबेस में नहीं मिली!");
                    window.location.href = "index.html";
                }
            } catch (err) {
                alert("डेटा लोड करने में समस्या आई: " + err.message);
            }
        }

        // Form Submit (Add ya Update dono handle karega)
        newsForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const headline = document.getElementById("headline").value.trim();
            const category = document.getElementById("category").value;
            const location = document.getElementById("location").value.trim();
            const shortDescription = document.getElementById("shortDescription").value.trim();
            const fullNews = document.getElementById("fullNews").value.trim();
            const imageFile = document.getElementById("newsImage").files[0];
            const breakingNews = document.getElementById("breakingNews").checked;
            const featuredNews = document.getElementById("featuredNews").checked;

            if (!headline || !fullNews) {
                alert("कृपया Headline और पूरी News जरूर लिखें।");
                return;
            }

            publishBtn.disabled = true;
            publishBtn.innerText = editNewsId ? "⏳ Updating... कृपया प्रतीक्षा करें" : "⏳ Publishing... कृपया प्रतीक्षा करें";

            try {
                let imageUrl = existingImageUrl;

                // Agar nayi image select ki gayi hai toh Cloudinary par upload karein
                if (imageFile) {
                    const formData = new FormData();
                    formData.append("file", imageFile);
                    formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

                    const cloudRes = await fetch(
                        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                        { method: "POST", body: formData }
                    );

                    const cloudData = await cloudRes.json();
                    if (!cloudRes.ok) {
                        throw new Error(cloudData.error?.message || "Image upload failed");
                    }
                    imageUrl = cloudData.secure_url;
                }

                if (editNewsId) {
                    // Existing news ko update karein
                    const docRef = doc(db, "news", editNewsId);
                    await updateDoc(docRef, {
                        headline: headline,
                        category: category,
                        location: location,
                        shortDescription: shortDescription,
                        fullNews: fullNews,
                        imageUrl: imageUrl,
                        breakingNews: breakingNews,
                        featuredNews: featuredNews
                    });

                    alert("खबर सफलतापूर्वक Update हो गई! ✅");
                    window.location.href = "index.html";
                } else {
                    // Nayi news add karein
                    await addDoc(collection(db, "news"), {
                        headline: headline,
                        category: category,
                        location: location,
                        shortDescription: shortDescription,
                        fullNews: fullNews,
                        imageUrl: imageUrl,
                        breakingNews: breakingNews,
                        featuredNews: featuredNews,
                        date: new Date().toLocaleDateString("hi-IN"),
                        createdAt: serverTimestamp()
                    });

                    alert("खबर सफलतापूर्वक Live Database में Publish हो गई! 🎉");
                    newsForm.reset();
                }

            } catch (error) {
                console.error("Error saving news:", error);
                alert("Error: खबर सेव नहीं हो पाई। " + error.message);
            } finally {
                publishBtn.disabled = false;
                publishBtn.innerText = editNewsId ? "💾 Update News" : "🚀 Publish News";
            }
        });
    </script>

</body>
</html>
